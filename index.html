<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #080812;
    color: white;
    min-height: 100vh;
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

/* =========================
   AUTH
========================= */

#authScreen {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;

    background:
        radial-gradient(circle at 20% 20%, #35206b 0%, transparent 30%),
        radial-gradient(circle at 80% 80%, #142f67 0%, transparent 30%),
        #080812;
}

.auth-container {
    width: 100%;
    max-width: 420px;
}

.logo {
    text-align: center;
    margin-bottom: 30px;
}

.logo-icon {
    font-size: 60px;
    margin-bottom: 10px;
}

.logo h1 {
    font-size: 42px;
    letter-spacing: 2px;
}

.logo p {
    color: #9999b5;
    margin-top: 8px;
}

.auth-card {
    background: rgba(20,20,38,.95);
    border: 1px solid #2d2d4b;
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 20px 70px rgba(0,0,0,.4);
}

.auth-card h2 {
    margin-bottom: 8px;
}

.auth-subtitle {
    color: #9696ad;
    margin-bottom: 25px;
}

.input-group {
    margin-bottom: 15px;
}

.input-group label {
    display: block;
    margin-bottom: 7px;
    color: #cfcfe3;
    font-size: 14px;
}

.input-group input,
.input-group select {
    width: 100%;
    padding: 13px 15px;
    border: 1px solid #383853;
    border-radius: 10px;
    background: #10101e;
    color: white;
    outline: none;
}

.primary-btn {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg,#7c4dff,#4c8dff);
    color: white;
    font-weight: bold;
    margin-top: 5px;
}

.primary-btn:hover {
    opacity: .9;
}

.auth-switch {
    text-align: center;
    margin-top: 20px;
    color: #9292a8;
}

.auth-switch button {
    background: none;
    border: none;
    color: #9d7aff;
    font-weight: bold;
}

.message {
    margin-top: 15px;
    padding: 10px;
    border-radius: 8px;
    display: none;
    font-size: 14px;
    line-height: 1.5;
}

.error {
    background: #3a1820;
    color: #ff9aa9;
}

.success {
    background: #173525;
    color: #91e5ae;
}

/* =========================
   APP
========================= */

#app {
    display: none;
    min-height: 100vh;
}

.app-layout {
    display: grid;
    grid-template-columns: 230px minmax(0,1fr) 280px;
    min-height: 100vh;
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
    border-right: 1px solid #242438;
    padding: 25px 15px;
    background: #0b0b15;
    position: sticky;
    top: 0;
    height: 100vh;
}

.sidebar-logo {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 35px;
    padding: 0 10px;
}

.nav-item {
    width: 100%;
    background: none;
    border: none;
    color: #9b9bb1;
    text-align: left;
    padding: 13px;
    border-radius: 10px;
    margin-bottom: 5px;
}

.nav-item:hover,
.nav-item.active {
    background: #1a1830;
    color: white;
}

.sidebar-bottom {
    position: absolute;
    bottom: 20px;
    left: 15px;
    right: 15px;
}

/* =========================
   MAIN
========================= */

.main {
    padding: 30px;
    max-width: 850px;
    width: 100%;
    margin: auto;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.topbar h2 {
    font-size: 28px;
}

.theme-btn {
    border: 1px solid #303047;
    background: #131322;
    color: white;
    padding: 9px 13px;
    border-radius: 9px;
}

/* =========================
   CREATE POST
========================= */

.create-post {
    background: #111120;
    border: 1px solid #29293f;
    border-radius: 15px;
    padding: 18px;
    margin-bottom: 20px;
}

.create-post textarea {
    width: 100%;
    min-height: 80px;
    resize: vertical;
    background: transparent;
    border: none;
    outline: none;
    color: white;
    font-size: 15px;
}

.create-post-bottom {
    display: flex;
    justify-content: flex-end;
    margin-top: 10px;
}

.post-btn {
    background: #7653e6;
    color: white;
    border: none;
    padding: 9px 17px;
    border-radius: 9px;
    font-weight: bold;
}

/* =========================
   POSTS
========================= */

.post {
    background: #111120;
    border: 1px solid #29293f;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 15px;
}

.post-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 15px;
}

.avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: linear-gradient(135deg,#7c4dff,#4c8dff);
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    overflow: hidden;
    flex-shrink: 0;
}

.avatar img,
.profile-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.post-user {
    font-weight: bold;
}

.post-time {
    color: #77778d;
    font-size: 12px;
    margin-top: 3px;
}

.post-content {
    line-height: 1.6;
    color: #d6d6e3;
    white-space: pre-wrap;
}

.post-actions {
    display: flex;
    gap: 20px;
    margin-top: 15px;
}

.post-actions button {
    background: none;
    border: none;
    color: #85859c;
}

.post-actions button:hover {
    color: white;
}

/* =========================
   RIGHT BAR
========================= */

.rightbar {
    border-left: 1px solid #242438;
    padding: 25px 20px;
    background: #0b0b15;
}

.right-card {
    background: #111120;
    border: 1px solid #29293f;
    border-radius: 15px;
    padding: 18px;
    margin-bottom: 15px;
}

.right-card h3 {
    margin-bottom: 15px;
}

.current-user {
    display: flex;
    align-items: center;
    gap: 12px;
}

.profile-avatar {
    width: 55px;
    height: 55px;
    border-radius: 50%;
    overflow: hidden;
    background: linear-gradient(135deg,#7c4dff,#4c8dff);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

/* =========================
   MODAL
========================= */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.7);
    justify-content: center;
    align-items: center;
    z-index: 100;
}

.modal-card {
    width: 90%;
    max-width: 450px;
    background: #111120;
    border: 1px solid #303049;
    border-radius: 18px;
    padding: 25px;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
}

.close-btn {
    background: none;
    border: none;
    color: #aaa;
    font-size: 24px;
}

.settings-input {
    width: 100%;
    padding: 12px;
    background: #0d0d19;
    color: white;
    border: 1px solid #303049;
    border-radius: 9px;
    margin: 7px 0 15px;
}

.save-btn {
    width: 100%;
    padding: 11px;
    background: #7653e6;
    color: white;
    border: none;
    border-radius: 10px;
    margin-bottom: 10px;
}

.logout-btn {
    width: 100%;
    padding: 11px;
    background: #351922;
    border: 1px solid #632c39;
    color: #ff9cab;
    border-radius: 10px;
}

/* =========================
   MOBILE
========================= */

@media (max-width:1000px) {

    .app-layout {
        grid-template-columns: 75px minmax(0,1fr);
    }

    .sidebar-logo {
        font-size: 0;
        text-align: center;
    }

    .sidebar-logo::after {
        content: "✦";
        font-size: 25px;
    }

    .nav-item {
        text-align: center;
        font-size: 0;
    }

    .rightbar {
        display: none;
    }
}

@media (max-width:650px) {

    .app-layout {
        display: block;
    }

    .sidebar {
        height: auto;
        position: fixed;
        bottom: 0;
        top: auto;
        left: 0;
        right: 0;
        z-index: 50;
        border-right: none;
        border-top: 1px solid #242438;
        padding: 8px;
    }

    .sidebar-logo,
    .sidebar-bottom {
        display: none;
    }

    .nav {
        display: flex;
        justify-content: space-around;
    }

    .nav-item {
        width: auto;
        margin: 0;
        padding: 10px 15px;
    }

    .main {
        padding: 20px 15px 80px;
    }
}

        language
    );

    document.documentElement.lang =
        language;

    applyLanguage();

}


/* ==================================================
   LANGUAGE UI
================================================== */

function applyLanguage() {

    document.querySelectorAll("[data-i18n]")
        .forEach(element => {

            const key =
                element.getAttribute("data-i18n");

            element.textContent =
                t(key);

        });

    document.querySelectorAll("[data-placeholder]")
        .forEach(element => {

            const key =
                element.getAttribute("data-placeholder");

            element.placeholder =
                t(key);

        });

    document.getElementById("authTagline").textContent =
        t("tagline");

    document.getElementById("loginTitle").textContent =
        t("welcome");

    document.getElementById("loginSubtitle").textContent =
        t("loginSubtitle");

    document.getElementById("loginButton").textContent =
        t("login");

    document.getElementById("noAccount").textContent =
        t("noAccount");

    document.getElementById("signupLink").textContent =
        t("signup");

    document.getElementById("signupTitle").textContent =
        t("join");

    document.getElementById("signupSubtitle").textContent =
        t("signupSubtitle");

    document.getElementById("usernameLabel").textContent =
        t("username");

    document.getElementById("signupButton").textContent =
        t("create");

    document.getElementById("alreadyAccount").textContent =
        t("already");

    document.getElementById("loginLink").textContent =
        t("login");

    document.getElementById("languageSelectAuth").value =
        currentLanguage;

    document.getElementById("languageSelectApp").value =

}

applyLanguage();


/* ==================================================
   AUTH UI
================================================== */

function showSignup() {

    document.getElementById("loginCard").style.display =
        "none";

    document.getElementById("signupCard").style.display =
        "block";

}

function showLogin() {

    document.getElementById("signupCard").style.display =
        "none";

    document.getElementById("loginCard").style.display =
        "block";

}

function showMessage(id,text,type) {

    const element =
        document.getElementById(id);

    element.textContent =
        text;

    element.className =
        "message " + type;

    element.style.display =
        "block";

}


/* ==================================================
   EMAIL VERIFICATION CHECK
================================================== */

function isEmailVerified(user) {

    return Boolean(
        user &&
        user.email_confirmed_at
    );

}


/* ==================================================
   SIGN UP
================================================== */

async function signUp() {

    const username =
        document.getElementById("signupUsername")
        .value.trim();

    const email =
        document.getElementById("signupEmail")
        .value.trim()
        .toLowerCase();

    const password =
        document.getElementById("signupPassword")
        .value;

    if (!username || !email || !password) {

        showMessage(
            "signupMessage",
            "Fill in all fields.",
            "error"
        );

        return;
    }

    if (username.length < 3) {

        showMessage(
            "signupMessage",
            "Username must contain at least 3 characters.",
            "error"
        );

        return;
    }

    if (password.length < 6) {

        showMessage(
            "signupMessage",
            "Password must contain at least 6 characters.",
            "error"
        );

        return;
    }

    const {
        data,
        error
    } =
    await supabaseClient.auth.signUp({

        email: email,

        password: password,

        options: {

            data: {
                username: username
            }

        }

    });

    if (error) {

        showMessage(
            "signupMessage",
            error.message,
            "error"
        );

        return;
    }

    /*
       Nawet jeśli Supabase zwróci session,
       nie wpuszczamy użytkownika, dopóki
       email nie jest potwierdzony.
    */

    if (
        data.user &&
        isEmailVerified(data.user)
    ) {

        const profileOk =
            await createProfile(
                data.user,
                username
            );

        if (!profileOk) {

            showMessage(
                "signupMessage",
                t("profileError"),
                "error"
            );

            return;
        }

        await openVerifiedApp(
            data.user
        );

        return;
    }

    /*
       Standardowa ścieżka:
       konto utworzone,
       teraz trzeba kliknąć link w e-mailu.
    */

    showMessage(
        "signupMessage",
        t("accountCreated"),
        "success"
    );

}


/* ==================================================
   CREATE PROFILE
================================================== */

async function createProfile(user, username) {

    if (!user) {
        return false;
    }

    const {
        data,
        error
    } =
    await supabaseClient
        .from("profiles")
        .upsert({

            id: user.id,

            username: username,

            language: currentLanguage

        }, {

            onConflict: "id"

        })
        .select()
        .single();

    if (error) {

        console.error(
            "Profile creation error:",
            error
        );

        return false;
    }

    currentProfile =
        data;

    return true;

}


/* ==================================================
   LOGIN
================================================== */

async function login() {

    const email =
        document.getElementById("loginEmail")
        .value.trim()
        .toLowerCase();

    const password =
        document.getElementById("loginPassword")
        .value;

    if (!email || !password) {

        showMessage(
            "loginMessage",
            "Enter your email and password.",
            "error"
        );

        return;
    }

    const {
        data,
        error
    } =
    await supabaseClient.auth
        .signInWithPassword({

            email: email,

            password: password

        });

    if (error) {

        showMessage(
            "loginMessage",
            error.message,
            "error"
        );

        return;
    }

    /*
       Dodatkowe zabezpieczenie.
       Nawet jeśli sesja istnieje,
       sprawdzamy potwierdzenie e-maila.
    */

    if (!isEmailVerified(data.user)) {

        await supabaseClient.auth.signOut();

        showMessage(
            "loginMessage",
            t("emailNotVerified"),
            "error"
        );

        return;
    }

    const profileOk =
        await ensureProfile(data.user);

    if (!profileOk) {

        showMessage(
            "loginMessage",
            t("profileError"),
            "error"
        );

        await supabaseClient.auth.signOut();

        return;
    }

    await openVerifiedApp(
        data.user
    );

}


/* ==================================================
   ENSURE PROFILE
================================================== */

async function ensureProfile(user) {

    if (!user) {
        return false;
    }

    if (!isEmailVerified(user)) {
        return false;
    }

    const {
        data: profile,
        error
    } =
    await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id", user.id)
        .maybeSingle();

    if (error) {

        console.error(
            "Profile lookup error:",
            error
        );

        return false;
    }

    if (profile) {

        currentProfile =
            profile;

        return true;
    }

    const username =
        user.user_metadata?.username
        || user.email.split("@")[0];

    return await createProfile(
        user,
        username
    );

}


/* ==================================================
   OPEN VERIFIED APP
================================================== */

async function openVerifiedApp(user) {

    if (!isEmailVerified(user)) {

        await supabaseClient.auth.signOut();

        return;
    }

    currentUser =
        user;

    const profileOk =
        await ensureProfile(user);

    if (!profileOk) {

        await supabaseClient.auth.signOut();

        document.getElementById("app").style.display =
            "none";

        document.getElementById("authScreen").style.display =
            "flex";

        showLogin();

        showMessage(
            "loginMessage",
            t("profileError"),
            "error"
        );

        return;
    }

    openApp();

    await loadCurrentUser();

    await loadPosts();

}


/* ==================================================
   LOGOUT
================================================== */

async function logout() {

    await supabaseClient.auth.signOut();

    currentUser = null;
    currentProfile = null;

    document.getElementById("feed").innerHTML = "";

    closeSettings();

    document.getElementById("app").style.display =
        "none";

    document.getElementById("authScreen").style.display =
        "flex";

    showLogin();

}


/* ==================================================
   OPEN APP
================================================== */

function openApp() {

    document.getElementById("authScreen").style.display =
        "none";

    document.getElementById("app").style.display =
        "block";

}


/* ==================================================
   CURRENT USER
================================================== */

let currentUser = null;
let currentProfile = null;


async function loadCurrentUser() {

    const {
        data,
        error
    } =
    await supabaseClient.auth.getUser();

    if (error || !data.user) {

        return false;
    }

    currentUser =
        data.user;

    const {
        data: profile,
        error: profileError
    } =
    await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id",currentUser.id)
        .maybeSingle();

    if (profileError || !profile) {

        return false;
    }

    currentProfile =
        profile;

    document.getElementById("currentUsername")
        .textContent =
        profile.username || "User";

    document.getElementById("currentEmail")
        .textContent =
        currentUser.email || "";

    document.getElementById("settingsUsername")
        .value =
        profile.username || "";

    document.getElementById("settingsBio")
        .value =
        profile.bio || "";

    renderCurrentAvatar(
        profile.avatar_url,
        profile.username
    );

    return true;

}


/* ==================================================
   CURRENT AVATAR
================================================== */

function renderCurrentAvatar(url, username) {

    const avatar =
        document.getElementById("currentAvatar");

    avatar.innerHTML = "";

    if (url) {

        const img =
            document.createElement("img");

        img.src =
            url;

        img.alt =
            "Avatar";

        avatar.appendChild(img);

    } else {

        avatar.textContent =
            username
                ? username[0].toUpperCase()
                : "✦";

    }

}


/* ==================================================
   LOAD POSTS
================================================== */

async function loadPosts() {

    const {
        data,
        error
    } =
    await supabaseClient
        .from("posts")
        .select(`
            id,
            content,
            created_at,
            user_id,
            profiles (
                username,
                avatar_url
            )
        `)
        .order("created_at", {
            ascending:false
        });

    if (error) {

        console.error(
            "Post loading error:",
            error
        );

        return;
    }

    const feed =
        document.getElementById("feed");

    feed.innerHTML = "";

    if (!data || data.length === 0) {

        return;
    }

    data.forEach(post => {

        renderPost(
            post,
            feed
        );

    });

}


/* ==================================================
   RENDER POST
================================================== */

function renderPost(post, feed) {

    const profile =
        post.profiles;

    const username =
        profile?.username
        || "User";

    const avatar =
        profile?.avatar_url;

    const article =
        document.createElement("article");

    article.className =
        "post";

    const avatarHTML =
        avatar
        ? `<img src="${escapeAttribute(avatar)}" alt="Avatar">`
        : escapeHtml(
            username[0]?.toUpperCase()
            || "✦"
        );

    article.innerHTML = `

        <div class="post-header">

            <div class="avatar">
                ${avatarHTML}
            </div>

            <div>

                <div class="post-user">
                    ${escapeHtml(username)}
                </div>

                <div class="post-time">
                    ${formatDate(post.created_at)}
                </div>

            </div>

        </div>

        <div class="post-content">
            ${escapeHtml(post.content)}
        </div>

        <div class="post-actions">

            <button type="button">
                ♡ Like
            </button>

            <button type="button">
                💬 Comment
            </button>

            <button type="button">
                ↗ Share
            </button>

        </div>

    `;

    feed.appendChild(article);

}


/* ==================================================
   CREATE POST
================================================== */

async function createPost() {

    if (!currentUser) {

        return;
    }

    if (!isEmailVerified(currentUser)) {

        await logout();

        return;
    }

    const input =
        document.getElementById("postInput");

    const content =
        input.value.trim();

    if (!content) {

        alert(t("emptyPost"));

        return;
    }

    if (content.length > 5000) {

        alert("Post is too long.");

        return;
    }

    const {
        data,
        error
    } =
    await supabaseClient
        .from("posts")
        .insert({

            user_id: currentUser.id,

            content: content

        })
        .select(`
            id,
            content,
            created_at,
            user_id,
            profiles (
                username,
                avatar_url
            )
        `)
        .single();

    if (error) {

        console.error(
            "Post creation error:",
            error
        );

        alert(
            t("postError")
            + "\n\n"
            + error.message
        );

        return;
    }

    input.value = "";

    const feed =
        document.getElementById("feed");

    const articleContainer =
        document.createElement("div");

    renderPost(
        data,
        articleContainer
    );

    if (articleContainer.firstElementChild) {

        feed.prepend(
            articleContainer.firstElementChild
        );

    }

}


/* ==================================================
   SAVE PROFILE + AVATAR
================================================== */

async function saveProfile() {

    if (!currentUser) {
        return;
    }

    if (!isEmailVerified(currentUser)) {

        alert(t("emailNotVerified"));

        return;
    }

    const username =
        document.getElementById("settingsUsername")
        .value.trim();

    const bio =
        document.getElementById("settingsBio")
        .value.trim();

    if (username.length < 3) {

        alert("Username must contain at least 3 characters.");

        return;
    }

    if (username.length > 30) {

        alert("Username is too long.");

        return;
    }

    let avatarUrl =
        currentProfile?.avatar_url || null;

    const file =
        document.getElementById("avatarInput")
        .files[0];

    /*
       AVATAR
    */

    if (file) {

        const allowedTypes = [
            "image/png",
            "image/jpeg",
            "image/webp"
        ];

        if (!allowedTypes.includes(file.type)) {

            alert(
                "Use PNG, JPG or WebP."
            );

            return;
        }

        if (file.size > 5 * 1024 * 1024) {

            alert(
                "Maximum image size is 5 MB."
            );

            return;
        }

        const extension =
            file.type === "image/png"
                ? "png"
                : file.type === "image/webp"
                    ? "webp"
                    : "jpg";

        /*
           Każdy upload ma unikalną nazwę.
           Nie używamy upsert.
        */

        const filePath =
            currentUser.id
            + "/"
            + Date.now()
            + "-"
            + crypto.randomUUID()
            + "."
            + extension;

        const {
            error: uploadError
        } =
        await supabaseClient
            .storage
            .from("avatars")
            .upload(
                filePath,
                file,
                {
                    cacheControl:"3600",
                    contentType:file.type,
                    upsert:false
                }
            );

        if (uploadError) {

            console.error(
                "Avatar upload error:",
                uploadError
            );

            alert(
                t("avatarError")
                + "\n\n"
                + uploadError.message
            );

            return;
        }

        const {
            data: publicData
        } =
        supabaseClient
            .storage
            .from("avatars")
            .getPublicUrl(filePath);

        avatarUrl =
            publicData.publicUrl;

    }


    /*
       PROFILE UPDATE
    */

    const {
        data: updatedProfile,
        error
    } =
    await supabaseClient
        .from("profiles")
        .update({

            username: username,

            bio: bio,

            avatar_url: avatarUrl,

            language: currentLanguage

        })
        .eq("id", currentUser.id)
        .select()
        .single();

    if (error) {

        console.error(
            "Profile update error:",
            error
        );

        alert(
            "Could not save profile:\n\n"
            + error.message
        );

        return;
    }

    currentProfile =
        updatedProfile;

    await loadCurrentUser();

    await loadPosts();

    document.getElementById("avatarInput")
        .value = "";

    alert(t("profileSaved"));

    closeSettings();

}


/* ==================================================
   SETTINGS
================================================== */

function openSettings() {

    document.getElementById("settingsModal")
        .style.display =
        "flex";

}

function closeSettings() {

    document.getElementById("settingsModal")
        .style.display =
        "none";

}

function openProfile() {

    openSettings();

}


/* ==================================================
   DATE
================================================== */

function formatDate(date) {

    const d =
        new Date(date);

    return d.toLocaleString(
        currentLanguage,
        {
            dateStyle:"medium",
            timeStyle:"short"
        }
    );

}


/* ==================================================
   SECURITY
================================================== */

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text ?? "";

    return div.innerHTML;

}

function escapeAttribute(text) {

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#39;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");

}


/* ==================================================
   THEME
================================================== */

function toggleTheme() {

    const body =
        document.body;

    const current =
        body.dataset.theme;

    if (current === "light") {

        body.dataset.theme =
            "dark";

        localStorage.setItem(
            "magnetar-theme",
            "dark"
        );

    } else {

        body.dataset.theme =
            "light";

        localStorage.setItem(
            "magnetar-theme",
            "light"
        );

    }

}


/* ==================================================
   SESSION
================================================== */

async function checkSession() {

    const {
        data,
        error
    } =
    await supabaseClient.auth.getSession();

    if (error) {

        console.error(
            "Session error:",
            error
        );

        return;
    }

    const session =
        data.session;

    if (!session) {

        return;
    }

    /*
       Bardzo ważne:
       sama sesja NIE oznacza,
       że email jest potwierdzony.
    */

    if (!isEmailVerified(session.user)) {

        await supabaseClient.auth.signOut();

        return;
    }

    await openVerifiedApp(
        session.user
    );

}


/* ==================================================
   AUTH STATE
================================================== */

supabaseClient.auth.onAuthStateChange(
    async (event, session) => {

        if (
            (
                event === "SIGNED_IN"
                || event === "INITIAL_SESSION"
            )
            && session
        ) {

            /*
               Nie wpuszczamy nieweryfikowanych.
            */

            if (!isEmailVerified(session.user)) {

                await supabaseClient.auth.signOut();

                return;
            }

            /*
               Odkładamy operacje na chwilę,
               żeby uniknąć konfliktów z Auth event.
            */

            setTimeout(async () => {

                await openVerifiedApp(
                    session.user
                );

            }, 0);

        }

    }
);


/* ==================================================
   START
================================================== */

checkSession();

</script>
